# Só a API, em container, sem observabilidade — para testar a imagem de
# produção localmente.
#
#   docker compose -f docker-compose.api.yml up -d --build
#
# Banco, MinIO e Valkey continuam vindo de onde o `.env` apontar. Se for o
# `docker-compose.dev.yml` rodando no host, troque `localhost` por
# `host.docker.internal` no `.env` (ou sobrescreva abaixo): dentro do container
# `localhost` é o próprio container.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
