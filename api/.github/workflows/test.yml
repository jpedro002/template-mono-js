name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # Sem serviço de banco: o client do Prisma é substituído no preload dos
      # testes. O client gerado está versionado, então também não há generate.
      - run: bun test --coverage

      - run: bunx biome check .
